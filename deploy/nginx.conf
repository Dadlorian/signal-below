# Static hosting for the game. Nothing here touches the game's code.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Compress text on the way to Cloudflare (it goes through the tunnel from home).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

  # NOTE: add_header inside a location replaces the server-level ones,
  # so the two security headers are repeated in every location below.

  # Build output with a hash in the file name (index-AbC123.js). The name changes
  # whenever the code changes, so a year of caching is safe and updates show instantly.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # Browsers ask for this by habit. The pages declare their own icon, so answer "nothing here".
  location = /favicon.ico {
    access_log off;
    add_header Cache-Control "public, max-age=86400" always;
    return 204;
  }

  # There is no API on this server. Say 404 instead of showing the game page.
  location ^~ /api/ {
    add_header X-Content-Type-Options nosniff always;
    return 404;
  }

  # Other plain files (icons, doc images, robots.txt): cache a day, and a missing one is a real 404.
  location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|webp|woff2?|txt|xml)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # Pages (the game and the guides). no-cache = "check with me every time", which costs
  # a tiny 304 reply. That way friends get a new version right after the son's next update.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
