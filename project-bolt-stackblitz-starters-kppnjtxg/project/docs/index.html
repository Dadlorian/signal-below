<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Docs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root { color-scheme: dark; --ground: #0f1513; --surface: #161e1b; --line: #2b3732; --ink: #efe6cc; --ink-2: #c6c3aa; --muted: #949f8f; --brass: #dfbd71; }
@media (prefers-color-scheme: light) { :root { color-scheme: light; --ground: #f3ecd9; --surface: #f9f3e3; --line: #d8cba8; --ink: #1a221f; --ink-2: #364039; --muted: #59634f; --brass: #85611a; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--ground); color: var(--ink); font: 400 1.05rem/1.6 "Space Grotesk", system-ui, sans-serif; padding: 64px max(16px, 6vw); }
main { max-width: 720px; margin: 0 auto; display: grid; gap: 28px; }
.k { font: 500 0.8rem/1 "DM Mono", ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass); }
h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -0.04em; line-height: 1.05; }
.cards { display: grid; gap: 12px; }
a.card { display: grid; gap: 6px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); text-decoration: none; }
a.card:hover, a.card:focus-visible { border-color: var(--brass); outline: none; }
a.card b { font-size: 1.2rem; }
a.card span { color: var(--ink-2); font-size: 0.95rem; }
a.card small { font: 400 0.78rem/1 "DM Mono", ui-monospace, monospace; color: var(--muted); }
.back { color: var(--brass); font: 500 0.85rem/1 "DM Mono", ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <div class="k">JB Playnet · docs</div>
  <h1>How the arcade works</h1>
  <div class="cards">
    <a class="card" href="hacker-journey.html"><b>Signal Hacker ▸</b><span>Start here. Eleven stages that turn the code into a game you can play.</span><small>docs/hacker-journey.html</small></a>
    <a class="card" href="field-manual.html"><b>Field Manual</b><span>The full reference: every part of the code, floor by floor.</span><small>docs/field-manual.html</small></a>
  </div>
  <a class="back" href="/">← Back to the arcade</a>
</main>
</body>
</html>
